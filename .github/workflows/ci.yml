name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Default workspace members: everything except the desktop app,
      # including the daemon's web interface.
      - name: Clippy
        run: cargo clippy --all-targets --features kinvault-daemon/web -- -D warnings

      - name: Test
        run: cargo test --features kinvault-daemon/web

  gui:
    name: Desktop app (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK and friends
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Clippy
        run: cargo clippy -p kinvault-gui --all-targets -- -D warnings

      - name: Check frontend syntax
        run: |
          node --check crates/kinvault-gui/ui/app.js
          for f in crates/kinvault-daemon/web/*.js; do node --check "$f"; done
