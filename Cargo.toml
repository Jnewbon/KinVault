[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app needs WebKitGTK and friends on Linux; build it explicitly
# with `cargo build -p kinvault-gui` so the rest builds anywhere.
default-members = ["crates/kinvault-core", "crates/kinvault-net", "crates/kinvault-daemon", "crates/kinvault-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
kinvault-core = { path = "crates/kinvault-core" }
kinvault-net = { path = "crates/kinvault-net" }
kinvault-daemon = { path = "crates/kinvault-daemon" }

anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
blake3 = "1.8"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
data-encoding = "2"
directories = "6"
fastcdc = "3"
futures-util = { version = "0.3", default-features = false }
gethostname = "1"
getrandom = "0.3"
hex = "0.4"
iroh = "1.3"
jiff = "0.2"
notify = "8"
postcard = { version = "1.1", features = ["use-std"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
