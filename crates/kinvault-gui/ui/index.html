<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KinVault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><img src="logo.png" alt=""><span>KinVault</span></div>
      <button class="nav-item active" data-page="backups">Backups</button>
      <button class="nav-item" data-page="restore">Restore</button>
      <button class="nav-item" data-page="friends">Friends</button>
      <button class="nav-item" data-page="settings">Settings</button>
      <div class="sidebar-foot">
        <span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span>
      </div>
    </nav>
    <main id="main">
      <div class="banner" id="banner" hidden></div>
      <section class="page" id="page-backups"></section>
      <section class="page" id="page-restore" hidden></section>
      <section class="page" id="page-friends" hidden></section>
      <section class="page" id="page-settings" hidden></section>
    </main>
  </div>
  <dialog id="modal"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
